name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl
  # The musl C compiler for ring and zstd-sys (from musl-tools).
  CC_x86_64_unknown_linux_musl: musl-gcc

jobs:
  check:
    name: Lint, unit tests, static build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -yq musl-tools
          rustup component add clippy
          rustup target add "$TARGET"
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --release
      - name: Static binary
        run: |
          cargo build --release --target "$TARGET"
          ./target/$TARGET/release/plybox version
      - uses: actions/upload-artifact@v7
        with:
          name: plybox-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/plybox

  integration:
    name: Sandbox suites (policy, sessions)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup target add "$TARGET"
      # Ubuntu 24.04 ships bubblewrap 0.9.0, which has no overlay mounts.
      # Build the oldest version plybox supports, so that claim stays tested.
      - name: bubblewrap 0.11.0, musl-tools, user namespaces
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools meson ninja-build pkg-config libcap-dev
          git clone -q --depth 1 --branch v0.11.0 https://github.com/containers/bubblewrap "$RUNNER_TEMP/bwrap"
          meson setup "$RUNNER_TEMP/bwrap/_build" "$RUNNER_TEMP/bwrap" -Dman=disabled -Dtests=false
          ninja -C "$RUNNER_TEMP/bwrap/_build" && sudo ninja -C "$RUNNER_TEMP/bwrap/_build" install
          # Ubuntu 23.10+ restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
          uname -r
      - name: bubblewrap smoke test
        run: |
          out="$(bwrap --unshare-all --unshare-user --die-with-parent --ro-bind / / --dev /dev --proc /proc true 2>&1)" \
            && echo "::notice title=bwrap::user namespaces work ($(bwrap --version), kernel $(uname -r))" \
            || { echo "::error title=bwrap::$out"; exit 1; }
      # Each suite prints one `check <TAB> name <TAB> pass|FAIL <TAB> detail`
      # line per check; failures become annotations on the run.
      - name: Hostile policy and operator rules
        run: |
          make test-policy 2>&1 | tee policy.log; code=${PIPESTATUS[0]}
          tests/helpers/annotate.sh policy policy.log "$code"
      - name: Session lifecycle, apply safety, resume
        if: success() || failure()
        run: |
          make test-sessions 2>&1 | tee sessions.log; code=${PIPESTATUS[0]}
          tests/helpers/annotate.sh sessions sessions.log "$code"
