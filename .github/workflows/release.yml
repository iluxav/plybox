name: Release

# Push a tag that matches Cargo.toml's version:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Build the static binary
        run: |
          rustup target add "$TARGET"
          cargo test --release
          cargo build --release --target "$TARGET"
      - name: Package
        run: |
          mkdir dist
          cp "target/$TARGET/release/plybox" dist/plybox-linux-x86_64
          cd dist && sha256sum plybox-linux-x86_64 > plybox-linux-x86_64.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "plybox $GITHUB_REF_NAME" --generate-notes --verify-tag
