[package]
name = "plybox"
version = "0.0.1"
edition = "2021"
description = "Run AI agents and untrusted code in a box: network by hostname allow list, API keys the box never sees, edits held for review, every decision recorded. No root, no daemon."
license = "MIT"
authors = ["Ilya Vinokurov"]
repository = "https://github.com/iluxav/plybox"
homepage = "https://github.com/iluxav/plybox"
readme = "README.md"
keywords = ["sandbox", "ai-agents", "security", "bubblewrap", "gvisor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
libc = "0.2"
seccompiler = "0.5"
landlock = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# TLS termination for secret hosts (ring: no cmake, builds anywhere a C compiler is).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Pulling OCI images (plybox pull / --image): registry v2 over HTTPS, layer
# decompression, tar extraction, digest verification. Same stack ply uses.
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
lto = true
