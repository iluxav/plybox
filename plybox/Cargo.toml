[package]
name = "plybox"
version = "0.0.1"
edition = "2021"
description = "Run an AI agent in a box whose only way out is through plybox: files by declared mounts, network by hostname through its proxy, every decision recorded"
license = "MIT"

[dependencies]
libc = "0.2"
seccompiler = "0.5"
landlock = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# TLS termination for secret hosts (ring: no cmake, builds anywhere a C compiler is).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
lto = true
