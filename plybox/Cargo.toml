[package]
name = "plybox"
version = "0.0.1"
edition = "2021"
description = "Run an AI agent in a box whose only way out is through plybox: files by declared mounts, network by hostname through its proxy, every decision recorded"
license = "MIT"

[dependencies]
libc = "0.2"
seccompiler = "0.5"
landlock = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
lto = true
