# plybox policy: Claude Code working on the ply repo.
#
#   cd ~/Projects/ply
#   plybox run --policy ~/Projects/plybox/lab/claude/ply.toml -- \
#     claude -p "…task…" --dangerously-skip-permissions
#
# --dangerously-skip-permissions is what the box is for: the agent acts
# without asking, and plybox is what contains it — no host home, network to
# four hosts only, the subscription token never inside, every edit held in
# the session until `plybox apply`.
#
# Hosts, measured (lab dry runs, 2026-11-07): Claude Code needs only
# api.anthropic.com with non-essential traffic off; building ply needs
# crates.io (index + static) and github.com for its backhand fork.
# github.com is broad — all of GitHub is readable — but the box holds no
# GitHub credentials, so it cannot push or post anything there.

[fs]
rootfs = "host"
workspace = "/home/iluxa/Projects/ply"
workspace_mode = "overlay"
ro_bind = [
  "/home/iluxa/.local/share/mise/installs/claude:/opt/claude",
  "/home/iluxa/.rustup:/opt/rustup",
  "/home/iluxa/.cargo/bin:/opt/cargo/bin",
]

[net]
allow = ["api.anthropic.com", "index.crates.io", "static.crates.io", "github.com"]

[secrets]
# Created by you with `claude setup-token`; plybox reads it, the box never sees it.
CLAUDE_CODE_OAUTH_TOKEN = { only = "api.anthropic.com", file = "~/.config/plybox/claude-token" }

[limits]
mem = "8G"
pids = 4096

[env]
PATH = "/opt/claude/latest:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin"
RUSTUP_HOME = "/opt/rustup"
CARGO_HOME = "/home/box/.cargo"
# Build output in the box's /tmp, so `plybox diff` shows source changes only.
CARGO_TARGET_DIR = "/tmp/target"
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
DISABLE_AUTOUPDATER = "1"
